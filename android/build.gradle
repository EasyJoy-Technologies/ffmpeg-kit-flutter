buildscript {
    ext.kotlin_version = "1.8.22"

    repositories {
        google()
        mavenLocal()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

// Self-hosted FFmpeg-Kit binaries bundled in this repo (see ffmpeg-build/README.md).
// The AAR is a dependency of this plugin, but Gradle resolves it in the *app's* classpath with the
// app's repositories. `allprojects {}` here would only reach this project (and its children), never
// the app, so the local repository is registered on every project of the consuming build instead.
// exclusiveContent: com.easyjoy.nicenote is looked up ONLY here, never on the network.
def ffmpegKitMavenRepo = file("libs/maven")

rootProject.allprojects {
    repositories {
        exclusiveContent {
            forRepository { maven { url = uri(ffmpegKitMavenRepo) } }
            filter { includeGroup("com.easyjoy.nicenote") }
        }
    }
}

repositories {
    google()
    mavenCentral()
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.antonkarpenko.ffmpegkit"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    defaultConfig {
        minSdk = 24
        versionCode 1
        versionName "1.0.0"
        consumerProguardFiles 'consumer-rules.pro'
    }

    dependencies {
        implementation("androidx.annotation:annotation:1.9.1")
        // FFmpeg 8.1.2 trimmed to what NiceNote uses (audio decoders, all demuxers, aac/alac/flac/pcm
        // encoders); arm64-v8a + armeabi-v7a NEON. Java layer identical to ffmpeg-kit-min 2.2.1.
        implementation("com.easyjoy.nicenote:ffmpeg-kit-nicenote:8.1.2-1")
    }
}